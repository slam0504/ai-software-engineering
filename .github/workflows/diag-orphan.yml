name: diag-orphan
# B2c 暫時性診斷 workflow——只存在於 b2c/diag 分支，不得合併進 main，B2c 結案後隨分支刪除。
# workflow_dispatch 對非 default branch 不會觸發，故以 push 限定分支觸發；matrix 展開 runner × replica 四個獨立 job。
on:
  push:
    branches: [b2c/diag]
concurrency:
  group: diag-orphan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diag:
    name: diag-${{ matrix.runner }}-r${{ matrix.replica }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, ubuntu-latest]
        replica: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
      - name: env
        shell: bash
        run: |
          (uname -a; sw_vers 2>/dev/null || cat /etc/os-release; sysctl -n hw.ncpu 2>/dev/null || nproc; go version; test -x internal/proc/testdata/diag-orphan.sh && echo "fixture executable: yes") | tee env.txt
          ps -eo pgid,pid,ppid,stat,etime,command > ps-job-start.txt
      - name: layer 1 — existing test x100
        shell: bash
        run: |
          set +e
          go test -race -run '^TestOrphanDoesNotHangNormalExit$' ./internal/claude -count=100 -timeout 30m -v -json 2>&1 | tee layer1-test.json
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > layer1-test.rc
          exit "$rc"
      - name: layer 2 — whitebox diag x100
        if: always()
        shell: bash
        env:
          DIAG_ITER: '100'
          DIAG_OUT: ${{ github.workspace }}/diag-out
          DIAG_RUNNER: ${{ matrix.runner }}-r${{ matrix.replica }}
        run: |
          set +e
          mkdir -p "$DIAG_OUT"
          go test -tags diag_orphan -race -run '^TestDiagOrphanTimeline$' ./internal/proc -count=1 -timeout 40m -v -json 2>&1 | tee layer2-diag.json
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > layer2-diag.rc
          exit "$rc"
      - name: residue snapshot (passive)
        if: always()
        run: ps -eo pgid,pid,ppid,stat,etime,command > ps-job-end.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag-${{ matrix.runner }}-r${{ matrix.replica }}
          if-no-files-found: error
          path: |
            env.txt
            ps-job-start.txt
            ps-job-end.txt
            layer1-test.json
            layer1-test.rc
            layer2-diag.json
            layer2-diag.rc
            diag-out/**
